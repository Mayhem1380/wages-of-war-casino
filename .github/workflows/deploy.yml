name: Build and Deploy Frontend via SCP

on:
  push:
    branches: [ main, chore/ci-lint-fixes ]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build -- --no-sourcemap

      - name: Package build
        id: package
        run: |
          TARFILE="wagesofwar_build_$(date +%Y%m%d%H%M%S).tar.gz"
          tar -czf "$TARFILE" -C frontend build
          echo "tarfile=$TARFILE" >> "$GITHUB_OUTPUT"

      - name: Check deploy credentials
        id: deploy_ready
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_PATH" ] && { [ -n "$DEPLOY_KEY" ] || [ -n "$DEPLOY_PASSWORD" ]; }; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Skipping deploy upload because DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, and either DEPLOY_KEY or DEPLOY_PASSWORD are not fully configured."

      - name: Upload tarball via SCP
        if: steps.deploy_ready.outputs.ready == 'true'
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "${{ steps.package.outputs.tarfile }}"
          target: "/tmp"

      - name: Extract on remote and run post-deploy command
        if: steps.deploy_ready.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            DEST=${{ secrets.DEPLOY_PATH }}
            TARFILE="/tmp/${{ steps.package.outputs.tarfile }}"
            mkdir -p "$DEST"
            tar -xzf "$TARFILE" -C "$DEST" --strip-components=1
            rm -f "$TARFILE"
            if [ -n "${{ secrets.DEPLOY_AFTER_CMD }}" ]; then
              echo "Running post-deploy command"
              bash -lc "${{ secrets.DEPLOY_AFTER_CMD }}"
            fi
