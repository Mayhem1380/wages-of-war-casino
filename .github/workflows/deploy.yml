name: Build and Deploy Frontend via SCP

on:
  push:
    branches: [ main, chore/ci-lint-fixes ]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight deploy secrets
        id: preflight
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "Missing DEPLOY_HOST secret." >&2; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Missing DEPLOY_USER secret." >&2; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "Missing DEPLOY_PATH secret." >&2; exit 1; }
          if [ -n "$DEPLOY_KEY" ]; then
            echo "auth=key" >> "$GITHUB_OUTPUT"
          elif [ -n "$DEPLOY_PASSWORD" ]; then
            echo "auth=password" >> "$GITHUB_OUTPUT"
          else
            echo "Set either DEPLOY_KEY or DEPLOY_PASSWORD before running deploy." >&2
            exit 1
          fi

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps --omit=optional

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build -- --no-sourcemap

      - name: Package build
        id: package
        run: |
          TARFILE="wagesofwar_build_$(date +%Y%m%d%H%M%S).tar.gz"
          tar -czf "$TARFILE" -C frontend build
          echo "tarfile=$TARFILE" >> "$GITHUB_OUTPUT"

      - name: Upload tarball via SCP (SSH key)
        if: steps.preflight.outputs.auth == 'key'
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "${{ steps.package.outputs.tarfile }}"
          target: "/tmp"

      - name: Upload tarball via SCP (password)
        if: steps.preflight.outputs.auth == 'password'
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "${{ steps.package.outputs.tarfile }}"
          target: "/tmp"

      - name: Extract on remote and run post-deploy command (SSH key)
        if: steps.preflight.outputs.auth == 'key'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            DEST=${{ secrets.DEPLOY_PATH }}
            TARFILE="/tmp/${{ steps.package.outputs.tarfile }}"
            mkdir -p "$DEST"
            tar -xzf "$TARFILE" -C "$DEST" --strip-components=1
            rm -f "$TARFILE"
            if [ -n "${{ secrets.DEPLOY_AFTER_CMD }}" ]; then
              echo "Running post-deploy command"
              bash -lc "${{ secrets.DEPLOY_AFTER_CMD }}"
            fi

      - name: Extract on remote and run post-deploy command (password)
        if: steps.preflight.outputs.auth == 'password'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            DEST=${{ secrets.DEPLOY_PATH }}
            TARFILE="/tmp/${{ steps.package.outputs.tarfile }}"
            mkdir -p "$DEST"
            tar -xzf "$TARFILE" -C "$DEST" --strip-components=1
            rm -f "$TARFILE"
            if [ -n "${{ secrets.DEPLOY_AFTER_CMD }}" ]; then
              echo "Running post-deploy command"
              bash -lc "${{ secrets.DEPLOY_AFTER_CMD }}"
            fi
