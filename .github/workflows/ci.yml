name: CI

on:
  push:
    branches: [ main, master, chore/ci-lint-fixes ]
  pull_request:
    branches: [ main, master, chore/ci-lint-fixes ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r backend/requirements.txt
      - name: Run backend smoke checks
        run: |
          . .venv/bin/activate
          python -m compileall backend
      - name: Run backend tests
        run: |
          . .venv/bin/activate
          pytest backend -q -m "not live"

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install frontend deps
        run: npm ci --prefix frontend --legacy-peer-deps --omit=optional
      - name: Build frontend
        run: npm --prefix frontend run build -- --no-sourcemap
      - name: Verify frontend build output
        run: |
          test -f frontend/build/index.html
