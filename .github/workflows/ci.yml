name: CI

on:
  push:
    branches: [ main, master, chore/ci-lint-fixes ]
  pull_request:
    branches: [ main, master, chore/ci-lint-fixes ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r backend/requirements.txt
      - name: Install dev tooling
        run: |
          . .venv/bin/activate
          pip install black flake8
      - name: Check formatting and lint changed backend files
        run: |
          . .venv/bin/activate
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          mapfile -t backend_files < <(git diff --name-only "$BASE_SHA" "${{ github.sha }}" | grep -E '^backend/.*\.py$' || true)
          if [ "${#backend_files[@]}" -eq 0 ]; then
            echo "No backend Python changes to lint"
            exit 0
          fi
          black --check "${backend_files[@]}"
          flake8 "${backend_files[@]}"
      - name: Run backend tests
        run: |
          . .venv/bin/activate
          pytest backend -q -m "not live"

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install frontend deps
        run: npm ci --prefix frontend --legacy-peer-deps --omit=optional
      - name: Build frontend
        run: npm --prefix frontend run build -- --no-sourcemap
      - name: Run frontend format & lint checks on changed source files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          mapfile -t frontend_files < <(git diff --name-only "$BASE_SHA" "${{ github.sha }}" | grep -E '^frontend/src/.*\.(js|jsx|ts|tsx)$' || true)
          if [ "${#frontend_files[@]}" -eq 0 ]; then
            echo "No frontend source changes to lint"
            exit 0
          fi
          npx --prefix frontend prettier --check "${frontend_files[@]}"
          ESLINT_USE_FLAT_CONFIG=false npx --prefix frontend eslint -c frontend/eslint.config.cjs "${frontend_files[@]}" --ext .js,.jsx,.ts,.tsx --max-warnings=0
      - name: Verify frontend build output
        run: |
          test -f frontend/build/index.html
